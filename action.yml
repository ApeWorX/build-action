name: Silverback Build Action
author: 'The ApeWorX Collective'
description: 'A GitHub Action to build docker images for a silverback repository and push to a container registry'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  # CLI flags
  generate:
    description: 'Whether to generate Dockerfile(s) first'
    required: false
    default: 'true'
  # TODO: Change this to `version` in a breaking change
  tag:
    description: 'Tag of the silverback docker images.'
    required: false
    default: 'latest'
  sdk:
    description: 'Version of Silverback to use for base image when building.'
    required: false
    default: 'stable'
  push:
    description: 'Push the image to the configured registry.'
    required: false
    default: 'false'

  # Docker registry config
  registry:
    description: 'The registry location you want to push to.'
    required: false
    default: 'ghcr.io'
  username:
    description: 'Add your username for your registry.'
    required: false
  password:
    description: 'Add your password for your registry.'
    required: false

outputs:
  built_images:
    description: 'List of Docker images that were built and pushed.'

runs:
  using: 'composite'
  steps:
    - name: Confirm inputs
      if: inputs.push == 'true'
      run: |
        if [[ -z "${{ inputs.username }}" ]] || [[ -z "${{ inputs.password }}" ]]; then
          echo "::error::Username and/or Password are missing for the push to the container registry"
          exit 1
        fi
      shell: bash

    - name: Set TAG_BASE
      run: |
        LOWERCASE_REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "TAG_BASE='${{ inputs.registry }}/$LOWERCASE_REPO_NAME'" >> $GITHUB_ENV
      shell: bash

    - name: Setup Python tool
      uses: astral-sh/setup-uv@v7

    - name: Log into GitHub Container Registry
      if: inputs.push == 'true'
      uses: docker/login-action@v2
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and Push
      shell: bash
      run: |
        uvx silverback build \
          --sdk ${{ inputs.sdk }} \
          --tag-base ${{ env.TAG_BASE }} \
          --version ${{ inputs.tag }} \
          ${{ inputs.generate == 'true' && '--generate' || ''}} \
          ${{ inputs.push == 'true' && '--push' || ''}}
